# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

version: '3'

includes:
  quality: https://raw.githubusercontent.com/Terradue/taskfile-utils/refs/heads/main/quality.yaml

tasks:

  build_playground_dev:
    internal: true
    desc: Build the playground container
    cmds:
    - docker build -t playground -f playground/Dockerfile .

  run_playground:
    desc: Run the playground container
    cmds:
    - docker pull {{.IMAGE_NAME}}
    - docker run --rm -it -p 80:8501 {{.IMAGE_NAME}}

  run_playground_dev:
    desc: Build and run the playground container
    deps:
    - build_playground_dev
    cmds:
    - docker run --rm -it -p 80:8501 playground

  playground: 
    desc: Run the local playground app
    cmds:
    - pip install streamlit streamlit_code_editor plantuml .
    - cd playground
    - streamlit run playground/playground.py
